[project]
name = "zero-from-scratch"
version = "0.1.0"
description = "ZeRO-1, ZeRO-2 and ZeRO-3 written by hand and run on 32 CPU processes that stand in for 32 GPUs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.30",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyarrow>=17",
    "pytest>=8",
    "tokenizers>=0.20",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]
